name: Gerar animacao de contribuicoes

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6B46C1&color_dots=#EDE9FE,#C4B5FD,#A855F7,#7E22CE,#4C1D95
            dist/snake-dark.svg?color_snake=#C084FC&color_dots=#161B22,#4C1D95,#7E22CE,#A855F7,#E9D5FF

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
